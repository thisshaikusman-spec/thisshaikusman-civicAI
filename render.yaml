services:
  # FastAPI Backend Service
  - type: web
    name: municipal-backend
    env: python
    rootDir: AI-Municipal-Grievance backend/member2-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AI Municipal Grievance API
      - key: DATABASE_URL
        value: sqlite:///./complaints.db
      - key: JWT_SECRET
        generateValue: true

  # Next.js Frontend Service
  - type: web
    name: municipal-frontend
    env: node
    rootDir: municipal frontend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: municipal-backend
          property: host
